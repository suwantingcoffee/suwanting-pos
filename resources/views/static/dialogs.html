<dialog x-ref="editorDialog" @cancel="if(busy) $event.preventDefault()" @close="if(editor) editor.password=''; if(modal==='editor') modal=''" class="w-[calc(100%-2rem)] max-w-2xl rounded-2xl border border-stone-200 bg-white p-6 text-stone-900 backdrop:bg-black/50 dark:border-stone-700 dark:bg-stone-900 dark:text-stone-100">
    <template x-if="editor"><form @submit.prevent="saveEditor()"><h2 class="mb-5 text-xl font-semibold" x-text="(editor.data.id?'Edit ':'Tambah ')+editorSchema.label"></h2><div x-show="editorError" x-text="editorError" role="alert" class="mb-5 rounded-xl bg-red-50 p-3 text-sm text-red-800 dark:bg-red-950 dark:text-red-100"></div>
        <fieldset :disabled="busy" class="grid gap-4 sm:grid-cols-2">
            <template x-for="field in editorSchema.fields" :key="field.key">
                <div :class="field.type==='textarea'?'sm:col-span-2':''">
                    <template x-if="field.type==='checkbox'">
                        <label class="flex items-start gap-3 text-sm"><input type="checkbox" x-model="editor.data[field.key]" class="mt-1 accent-brand"><span x-text="field.label"></span></label>
                    </template>
                    <template x-if="field.type!=='checkbox'">
                        <div class="text-sm">
                            <label :for="'editor-'+field.key" class="block" x-text="field.label"></label>
                            <template x-if="field.type==='select'">
                                <select :id="'editor-'+field.key" x-model="editor.data[field.key]" :required="field.required" @change="if(editor.entity==='recipes'&&field.key==='product_id') editor.data.product_variant_id=''" :disabled="editor.entity==='ingredients'&&!!editor.data.id&&field.key==='inventory_unit_id'" class="field mt-2">
                                    <option value="" x-text="field.key==='product_variant_id'?'Standar / semua varian':'Pilih…'"></option>
                                    <template x-for="option in choices(field.source)" :key="option.id"><option :value="option.id" x-text="option.name"></option></template>
                                </select>
                            </template>
                            <template x-if="field.type==='textarea'"><textarea :id="'editor-'+field.key" x-model="editor.data[field.key]" :maxlength="field.max" :required="field.required" class="field mt-2" rows="3"></textarea></template>
                            <template x-if="!['select','textarea'].includes(field.type)"><input :id="'editor-'+field.key" x-model="editor.data[field.key]" :type="field.type" :required="field.required" :maxlength="field.max" :step="field.step" :min="field.min" class="field mt-2"></template>
                        </div>
                    </template>
                </div>
            </template>
        <template x-if="editor.entity==='profiles'"><label class="text-sm sm:col-span-2"><span x-text="editor.data.id?'Password baru (boleh kosong)':'Password awal'"></span><input x-model="editor.password" type="password" minlength="10" maxlength="128" :required="!editor.data.id" autocomplete="new-password" class="field mt-2"><span class="mt-2 block text-xs text-stone-500">Minimal 10 karakter. Perubahan email/password memakai Supabase Edge Function.</span></label></template>
        <template x-if="editor.entity==='products'"><section class="grid gap-4 sm:col-span-2"><label class="text-sm">Foto produk<input @change="editor.photo=$event.target.files[0]||null" type="file" accept="image/jpeg,image/png,image/webp" class="field mt-2"><span class="mt-2 block text-xs text-stone-500">JPG, PNG, WebP · maksimal 2 MB.</span></label><h3 class="mt-3 font-semibold">Varian produk</h3><template x-for="(variant,index) in editor.data.variants" :key="index"><div class="rounded-xl border border-stone-200 p-3 dark:border-stone-700"><div class="grid gap-3 sm:grid-cols-3"><label class="text-xs">Nama<input x-model="variant.name" required maxlength="80" class="field mt-2"></label><label class="text-xs">SKU<input x-model="variant.sku" required maxlength="60" class="field mt-2"></label><label class="text-xs">Tambahan harga<input x-model="variant.price_adjustment" type="number" min="0" step="0.01" required class="field mt-2"></label></div><div class="mt-3 flex justify-between gap-3"><label class="flex gap-2 text-xs"><input x-model="variant.is_active" type="checkbox">Aktif</label><button type="button" @click="editor.data.variants.splice(index,1)" class="text-xs text-red-600">Hapus varian</button></div></div></template><button type="button" @click="editor.data.variants.push({name:'',sku:'',price_adjustment:'0',is_active:true})" :disabled="editor.data.variants.length>=8" class="btn btn-secondary">Tambah varian</button></section></template>
        <template x-if="editor.entity==='recipes'">
            <section class="grid gap-4 sm:col-span-2">
                <h3 class="font-semibold">Takaran per satu produk</h3>
                <template x-for="(item,index) in editor.data.items" :key="index">
                    <div class="flex items-end gap-3">
                        <div class="flex-1 text-xs">
                            <label :for="'recipe-ingredient-'+index">Bahan</label>
                            <select :id="'recipe-ingredient-'+index" x-model="item.ingredient_id" required class="field mt-2">
                                <option value="">Pilih bahan</option>
                                <template x-for="ingredient in options.ingredients||[]" :key="ingredient.id"><option :value="ingredient.id" x-text="ingredient.name+' ('+ingredient.symbol+')'"></option></template>
                            </select>
                        </div>
                        <div class="w-28 text-xs">
                            <label :for="'recipe-quantity-'+index">Takaran</label>
                            <input :id="'recipe-quantity-'+index" x-model="item.quantity" type="number" min="0.001" max="999999.999" step="0.001" required class="field mt-2">
                        </div>
                        <button type="button" @click="editor.data.items.splice(index,1)" :disabled="editor.data.items.length<=1" class="btn btn-secondary" aria-label="Hapus bahan resep">×</button>
                    </div>
                </template>
                <button type="button" @click="editor.data.items.push({ingredient_id:'',quantity:'1'})" :disabled="editor.data.items.length>=30" class="btn btn-secondary">Tambah bahan resep</button>
                <p class="text-xs text-stone-500">Takaran memakai satuan dasar bahan. Resep varian menggantikan seluruh resep standar.</p>
            </section>
        </template>
        </fieldset><div class="mt-6 flex justify-end gap-3"><button type="button" @click="closeDialog('editorDialog')" :disabled="busy" class="btn btn-secondary">Batal</button><button :disabled="busy" class="btn btn-primary" x-text="busy?'Menyimpan…':'Simpan'"></button></div>
    </form></template>
</dialog>
<dialog x-ref="stockDialog" @cancel="if(busy||stockPending) $event.preventDefault()" class="w-[calc(100%-2rem)] max-w-lg rounded-2xl bg-white p-6 text-stone-900 backdrop:bg-black/50 dark:bg-stone-900 dark:text-stone-100"><template x-if="stockForm"><form @submit.prevent="saveStock()"><h2 class="text-xl font-semibold">Mutasi stok</h2><p class="mb-5 mt-2 text-sm text-stone-500" x-text="stockForm.ingredient_name"></p><p x-show="stockError" x-text="stockError" role="alert" class="mb-4 text-sm text-red-600"></p><fieldset :disabled="busy||!!stockPending" class="grid gap-4"><label class="text-sm">Jenis mutasi<select x-model="stockForm.type" class="field mt-2"><option value="receipt">Stok masuk</option><option value="adjustment">Penyesuaian stok</option></select></label><label x-show="stockForm.type==='adjustment'" class="text-sm">Arah penyesuaian<select x-model="stockForm.direction" class="field mt-2"><option value="add">Tambah</option><option value="remove">Kurangi</option></select></label><label class="text-sm">Jumlah (satuan dasar)<input x-model="stockForm.quantity" type="number" min="0.001" max="999999999.999" step="0.001" required class="field mt-2"></label><label class="text-sm">Referensi penerimaan / penyesuaian<input x-model="stockForm.reference" required maxlength="120" class="field mt-2" placeholder="Contoh: PO-001 / KOREKSI-001"></label><label class="text-sm">Alasan<textarea x-model="stockForm.reason" required maxlength="500" class="field mt-2" rows="3"></textarea></label></fieldset><div class="mt-6 flex justify-end gap-3"><button type="button" @click="closeDialog('stockDialog')" :disabled="busy" class="btn btn-secondary" x-text="stockPending?'Nanti':'Batal'"></button><button :disabled="busy" class="btn btn-primary" x-text="busy?'Menyimpan…':stockPending?'Ulangi penyimpanan':'Simpan mutasi'"></button></div></form></template></dialog>
<dialog x-ref="checkoutDialog" @cancel="if(busy) $event.preventDefault()" class="w-[calc(100%-2rem)] max-w-lg rounded-2xl bg-white p-6 text-stone-900 backdrop:bg-black/50 dark:bg-stone-900 dark:text-stone-100"><h2 class="text-xl font-semibold">Konfirmasi pesanan</h2><p class="mt-4 text-sm text-stone-500">Pastikan pesanan dan pembayaran sesuai. Total akhir memakai harga dan pajak di server.</p><div class="my-5 rounded-xl bg-orange-50 p-4 text-center dark:bg-orange-950/30"><p class="text-xs text-stone-500">Estimasi total</p><b class="mt-2 block text-2xl text-brand" x-text="money(totals.total)"></b></div><p class="text-xs text-stone-500" x-text="method==='cash'?'Pembayaran tunai dicatat lunas.':confirmed?'Simulasi pembayaran dicatat lunas.':'Pembayaran menunggu konfirmasi simulasi.'"></p><div class="mt-6 flex justify-end gap-3"><button @click="closeDialog('checkoutDialog')" :disabled="busy" class="btn btn-secondary">Periksa lagi</button><button @click="checkout()" :disabled="busy" class="btn btn-primary" x-text="busy?'Menyimpan…':'Simpan pesanan'"></button></div></dialog>
<dialog x-ref="confirmDialog" @cancel="if(busy) $event.preventDefault()" class="w-[calc(100%-2rem)] max-w-lg rounded-2xl bg-white p-6 text-stone-900 backdrop:bg-black/50 dark:bg-stone-900 dark:text-stone-100"><h2 class="text-xl font-semibold">Konfirmasi tindakan</h2><p class="mt-4 text-sm leading-6 text-stone-500" x-text="confirmation?.message"></p><div class="mt-6 flex justify-end gap-3"><button @click="closeDialog('confirmDialog')" :disabled="busy" class="btn btn-secondary">Batal</button><button @click="accept()" :disabled="busy" class="btn btn-primary">Lanjutkan</button></div></dialog>
<dialog x-ref="auditDialog" class="w-[calc(100%-2rem)] max-w-2xl rounded-2xl bg-white p-6 text-stone-900 backdrop:bg-black/50 dark:bg-stone-900 dark:text-stone-100"><h2 class="text-xl font-semibold">Rincian aktivitas</h2><pre class="mt-5 max-h-[60dvh] overflow-auto whitespace-pre-wrap break-words text-xs" x-text="confirmation?.message"></pre><button @click="closeDialog('auditDialog')" class="btn btn-secondary mt-5">Tutup</button></dialog>
<dialog x-ref="receiptDialog" @close="receiptPreview=false" class="w-[calc(100%-2rem)] max-w-lg rounded-2xl bg-white p-6 text-stone-900 backdrop:bg-black/50 dark:bg-stone-900 dark:text-stone-100"><div class="no-print flex items-center justify-between gap-3"><h2 class="font-semibold">Pratinjau struk · contoh</h2><button @click="closeDialog('receiptDialog')" class="btn btn-secondary">Tutup</button></div><!-- RECEIPT --></dialog>
