<article class="receipt-paper" :style="'--receipt-width:'+(receiptSettings.receipt_paper==='58'?'50mm':'72mm')">
    <h1 x-text="receiptSettings.shop_name"></h1><p class="whitespace-pre-wrap text-center" x-text="receiptSettings.shop_address"></p><p class="text-center" x-text="receiptSettings.shop_phone"></p><p class="text-center" x-text="receiptSettings.shop_email"></p><p class="mt-3 whitespace-pre-wrap text-center" x-text="receiptSettings.receipt_header"></p>
    <div class="receipt-line"><p x-text="receiptSale?.invoice_number"></p><p x-text="dateTime(receiptSale?.created_at)"></p><p x-show="receiptSettings.receipt_show_cashier" x-text="'Kasir: '+(receiptSale?.cashier_name||'')"></p><p x-show="receiptSettings.receipt_show_customer" x-text="'Pelanggan: '+(receiptSale?.customer_name||'Umum')"></p><b x-text="receiptSale?.status==='paid'?'LUNAS':'MENUNGGU PEMBAYARAN'"></b></div>
    <div class="receipt-line"><template x-for="item in receiptSale?.items||[]" :key="item.id"><div class="mb-3"><b x-text="item.product_name"></b><p x-show="item.variant_name" x-text="item.variant_name"></p><p x-show="receiptSettings.receipt_show_sku" x-text="item.sku"></p><div class="receipt-row"><span x-text="item.quantity+' × '+money(item.unit_price)"></span><b x-text="money(item.subtotal)"></b></div><p x-show="item.notes" x-text="item.notes"></p></div></template></div>
    <div class="receipt-line"><div class="receipt-row"><span>Subtotal</span><b x-text="money(receiptSale?.subtotal)"></b></div><div class="receipt-row"><span>Diskon</span><b x-text="money(receiptSale?.discount)"></b></div><div class="receipt-row"><span>Pajak</span><b x-text="money(receiptSale?.tax_amount)"></b></div><div class="receipt-row text-base"><b>TOTAL</b><b x-text="money(receiptSale?.total)"></b></div></div>
    <div class="receipt-line"><p x-text="'Pembayaran: '+(receiptSale?.payment_method==='cash'?'Tunai':String(receiptSale?.payment_method||'').toUpperCase()+' · SIMULASI')"></p><div class="receipt-row"><span>Diterima</span><b x-text="money(receiptSale?.amount_received)"></b></div><div class="receipt-row"><span>Kembalian</span><b x-text="money(receiptSale?.change_amount)"></b></div></div><p class="receipt-line whitespace-pre-wrap text-center" x-text="receiptSettings.receipt_footer"></p>
</article>
