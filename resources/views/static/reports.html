<section x-show="page==='reports'">
    <div class="mb-6 flex flex-wrap justify-between gap-3"><div><p class="eyebrow">RINGKASAN USAHA</p><h1 class="page-title">Laporan penjualan</h1><p class="mt-2 text-sm text-stone-500">Hanya transaksi lunas. Tanggal mengikuti Asia/Jakarta.</p></div><button @click="exportReport()" :disabled="loading" class="btn btn-secondary">Ekspor produk CSV</button></div>
    <form @submit.prevent="loadPage()" class="card mb-6 flex flex-wrap items-end gap-3"><label class="text-xs">Dari<input x-model="filters.from" type="date" class="field mt-2"></label><label class="text-xs">Sampai<input x-model="filters.to" type="date" class="field mt-2"></label><button :disabled="loading" class="btn btn-primary">Tampilkan laporan</button></form>
    <div class="mb-6 grid gap-4 sm:grid-cols-2 xl:grid-cols-4"><div class="card"><p class="text-xs text-stone-500">Penjualan lunas</p><b class="mt-3 block text-2xl text-brand" x-text="money(report.total)"></b></div><div class="card"><p class="text-xs text-stone-500">Transaksi</p><b class="mt-3 block text-2xl" x-text="report.count||0"></b></div><div class="card"><p class="text-xs text-stone-500">Diskon</p><b class="mt-3 block text-2xl" x-text="money(report.discount)"></b></div><div class="card"><p class="text-xs text-stone-500">Pajak</p><b class="mt-3 block text-2xl" x-text="money(report.tax)"></b></div></div>
    <div class="grid items-start gap-6 xl:grid-cols-[2fr_1fr]"><div class="card"><h2 class="mb-4 font-semibold">Produk terlaris (maksimal 30)</h2><div class="table-wrap"><table><thead><tr><th>Produk</th><th>Varian</th><th>Jumlah</th><th>Subtotal</th></tr></thead><tbody><template x-for="(row,index) in report.products" :key="index"><tr><td x-text="row.product_name"></td><td x-text="row.variant_name||'Standar'"></td><td x-text="quantity(row.quantity)"></td><td x-text="money(row.subtotal)"></td></tr></template><tr x-show="!report.products.length"><td colspan="4" class="py-8 text-center text-stone-500">Belum ada penjualan lunas.</td></tr></tbody></table></div><p class="mt-3 text-xs text-stone-500">Subtotal produk sebelum diskon dan pajak.</p></div><div class="card"><h2 class="font-semibold">Metode pembayaran</h2><template x-for="row in report.methods" :key="row.payment_method"><div class="mt-5 flex justify-between gap-4 text-sm"><span class="uppercase" x-text="row.payment_method"></span><b x-text="money(row.total)"></b></div></template></div></div>
</section>
