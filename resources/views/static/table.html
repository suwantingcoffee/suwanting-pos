<section x-show="['transactions','customers','products','categories','product_types','inventory','users','audit'].includes(page)">
    <div class="mb-6 flex flex-wrap items-center justify-between gap-3"><div><p class="eyebrow">KELOLA TOKO</p><h1 class="page-title" x-text="title"></h1><p class="mt-2 text-sm text-stone-500" x-text="page==='inventory'?'Jaga stok, resep, dan setiap racikan.':page==='customers'?'Kenali pelanggan. Tetap layani pesanan tanpa pendaftaran.':'Data toko dan riwayat aktivitas.'"></p></div><div class="flex gap-2"><button @click="exportCsv()" :disabled="busy||loading" class="btn btn-secondary">Ekspor CSV</button><button x-show="editable" @click="edit()" class="btn btn-primary" :disabled="loading"><i data-lucide="plus" class="size-4"></i><span x-text="'Tambah '+(schemas[entity]?.label||'')"></span></button></div></div>
    <nav x-show="page==='inventory'" class="mb-5 flex gap-2 overflow-x-auto pb-2" aria-label="Modul inventori"><template x-for="tab in [{id:'ingredients',name:'Bahan baku'},{id:'units',name:'Satuan dasar'},{id:'recipes',name:'Resep'},{id:'movements',name:'Riwayat stok'},{id:'usage',name:'Pemakaian bahan'}]" :key="tab.id"><button @click="inventory(tab.id)" class="chip" :class="inventoryTab===tab.id?'bg-brand text-white':'bg-white dark:bg-stone-900'" x-text="tab.name"></button></template></nav>
    <div x-show="page==='inventory'&&stockPending" class="mb-5 rounded-xl bg-amber-50 p-4 text-sm text-amber-900 dark:bg-amber-950 dark:text-amber-100">Penyimpanan stok perlu diperiksa ulang. <button @click="resumeStock()" class="font-semibold underline">Ulangi penyimpanan</button></div>
    <p x-show="page==='inventory'&&entity==='recipes'" class="mb-4 text-sm text-stone-500">Resep varian menggantikan resep produk. Resep produk menjadi fallback. Produk tanpa resep aktif tetap bisa dijual tanpa potongan bahan.</p>
    <form @submit.prevent="loadTable()" class="card mb-5 flex flex-wrap items-end gap-3"><label class="min-w-40 flex-1 text-xs">Pencarian<input x-model="filters.q" maxlength="120" class="field mt-2" placeholder="Cari nama, SKU, atau referensi…"></label><label x-show="statusOptions.length" class="text-xs">Status<select x-model="filters.status" class="field mt-2"><option value="">Semua status</option><template x-for="option in statusOptions" :key="option.id"><option :value="option.id" x-text="option.name"></option></template></select></label><label x-show="dated" class="text-xs">Dari<input x-model="filters.from" type="date" class="field mt-2"></label><label x-show="dated" class="text-xs">Sampai<input x-model="filters.to" type="date" class="field mt-2"></label><label x-show="['usage','movements'].includes(entity)" class="text-xs">Bahan<select x-model="filters.ingredient_id" class="field mt-2"><option value="">Semua bahan</option><template x-for="item in options.ingredients||[]" :key="item.id"><option :value="item.id" x-text="item.name"></option></template></select></label><button class="btn btn-secondary" :disabled="loading">Terapkan</button></form>
    <div class="card !p-0"><div class="table-wrap"><table><thead><tr><template x-for="column in tableColumns" :key="column.key"><th x-text="column.label"></th></template><th>Aksi</th></tr></thead><tbody><template x-for="row in table.rows" :key="entity+':'+row.id"><tr><template x-for="column in tableColumns" :key="column.key"><td><span :class="column.type==='stock'&&row.low_stock?'font-semibold text-red-600':''" x-text="cell(row,column)"></span><span x-show="column.type==='stock'&&row.low_stock" class="ml-1 text-[10px] text-red-600">Minimum</span></td></template><td><div class="flex items-center gap-3 whitespace-nowrap text-xs font-semibold"><button x-show="editable" @click="edit(row)" class="text-brand">Edit</button><button x-show="editable&&entity!=='profiles'" @click="archive(row)" class="text-stone-500">Arsipkan</button><button x-show="editable&&entity!=='profiles'" @click="deleteRow(row)" :disabled="busy||loading" class="text-red-600">Hapus</button><button x-show="entity==='ingredients'" @click="openStock(row)" :disabled="!!stockPending" class="text-brand">Mutasi</button><a x-show="entity==='sales'" :href="'#/sale/'+row.id" class="text-brand">Detail</a><button x-show="entity==='audit'" @click="showAudit(row)" class="text-brand">Rincian</button></div></td></tr></template><tr x-show="!table.rows.length"><td :colspan="tableColumns.length+1" class="py-12 text-center text-stone-500">Belum ada data yang cocok.</td></tr></tbody></table></div><div class="flex flex-wrap items-center justify-between gap-3 p-4 text-xs text-stone-500"><span x-text="table.total+' data · Halaman '+table.page"></span><div class="flex gap-2"><button @click="loadTable(table.page-1)" :disabled="loading||table.page<=1" class="btn btn-secondary">Sebelumnya</button><button @click="loadTable(table.page+1)" :disabled="loading||table.page*table.per_page>=table.total" class="btn btn-secondary">Berikutnya</button></div></div></div>
</section>
